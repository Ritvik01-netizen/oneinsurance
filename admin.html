<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneInsurance — Broker Admin</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#FBFAF7;--card:#fff;--ink:#1D2926;--muted:#5D6A64;--border:#E5E1D8;--teal:#1D4E48;--teal2:#2A6159;--deep:#152F2B;--coral:#9C4732;--gold:#8A6D3B;--green:#2E7D5B;}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
h1,h2,h3{font-family:'Source Serif 4',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
header{background:var(--card);border-bottom:1px solid var(--border);padding:0 max(1.5rem,calc((100% - 1180px)/2));height:62px;display:flex;align-items:center;gap:1rem;}
header h1{font-size:20px;}
header .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
header .right{margin-left:auto;display:flex;gap:10px;align-items:center;}
.who{font-size:12.5px;color:var(--muted);}
main{max-width:1180px;margin:0 auto;padding:1.6rem 1.5rem 4rem;}
.btn{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:3px;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
.btn:hover{background:var(--teal2);}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--border);}
.btn.small{padding:6px 12px;font-size:12px;}
.btn.danger{background:var(--coral);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
/* login */
#login{max-width:400px;margin:5rem auto;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:2.2rem;}
#login h2{font-size:22px;margin-bottom:4px;}
#login p{font-size:13px;color:var(--muted);margin-bottom:1.4rem;}
.field{margin-bottom:1rem;}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:3px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;outline:none;background:var(--card);color:var(--ink);}
.field input:focus{border-color:var(--teal);}
.err{color:var(--coral);font-size:12.5px;margin-top:10px;min-height:16px;}
/* tabs */
.tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:1.4rem;background:var(--card);width:fit-content;}
.tab{padding:11px 22px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'IBM Plex Sans',sans-serif;border-right:1px solid var(--border);}
.tab:last-child{border-right:none;}
.tab.on{background:var(--deep);color:#fff;}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.4rem;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1.1rem 1.2rem;}
.stat b{font-family:'IBM Plex Mono',monospace;font-size:24px;display:block;font-weight:600;}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600;}
/* tables */
.panel{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.panel h3{font-size:16px;padding:1rem 1.2rem;border-bottom:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg);}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td .mono{font-size:12px;}
.stb{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:3px;white-space:nowrap;}
.stb.act,.stb.paid{background:rgba(62,142,108,0.12);color:var(--green);}
.stb.pend{background:rgba(217,164,65,0.16);color:#8A6420;}
.stb.rej{background:rgba(156,71,50,0.12);color:var(--coral);}
.empty{padding:2rem;text-align:center;color:var(--muted);font-size:13px;}
.toolbar{display:flex;gap:10px;margin-bottom:1rem;}
.toolbar input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:3px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;outline:none;background:var(--card);color:var(--ink);}
.toolbar input:focus{border-color:var(--teal);}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 22px;border-radius:3px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;}
#toast.show{opacity:1;}
.note{font-size:12px;color:var(--muted);line-height:1.6;padding:0.9rem 1.2rem;border-top:1px solid var(--border);background:var(--bg);}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr);}table{font-size:12px;}td,th{padding:8px;}}
</style>
</head>
<body>
<div id="toast"></div>
<header>
  <div><h1>OneInsurance</h1><span class="sub">Broker Admin</span></div>
  <div class="right" id="head-right"></div>
</header>

<!-- LOGIN -->
<div id="login">
  <h2>Broker sign in</h2>
  <p>Restricted area. Admin accounts only — all access is logged.</p>
  <div class="field"><label>Email</label><input id="l-email" type="email" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="l-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="btn" style="width:100%;" id="l-btn" onclick="doLogin()">Sign in</button>
  <div style="display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:11px;font-weight:700;"><div style="flex:1;height:1px;background:var(--border);"></div>OR<div style="flex:1;height:1px;background:var(--border);"></div></div>
  <button type="button" onclick="signInWithGoogleAdmin()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--border);color:var(--ink);padding:11px;border-radius:3px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;"><svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>Continue with Google</button>
  <p style="font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;">Google sign-in only grants admin access if this account is already flagged as admin.</p>
  <div class="err" id="l-err"></div>
</div>

<!-- APP -->
<main id="app" style="display:none;">
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab on" id="t-orders" onclick="showTab('orders')">Payments</button>
    <button class="tab" id="t-policies" onclick="showTab('policies')">Policies</button>
    <button class="tab" id="t-claims" onclick="showTab('claims')">Claims</button>
    <button class="tab" id="t-users" onclick="showTab('users')">Customers</button>
  </div>
  <div class="toolbar">
    <input id="q" placeholder="Search anything — name, reference, reg, email, status…" oninput="renderTab()">
    <button class="btn ghost small" onclick="exportCSV()">Export CSV</button>
    <button class="btn ghost small" onclick="doRefresh()">Refresh</button>
  </div>
  <div class="panel" id="panel"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/* Paste the same Firebase web config used in index.html below, then redeploy. */
const firebaseConfig={
  apiKey:"AIzaSyBvssVWzBFwkImHDgTWKmOuZ_MV0AarZMA",
  authDomain:"oneinsurance-mu.firebaseapp.com",
  projectId:"oneinsurance-mu",
  storageBucket:"oneinsurance-mu.firebasestorage.app",
  messagingSenderId:"824652888791",
  appId:"1:824652888791:web:61465653af1c6bb5e28e92"
};
let auth=null, db=null;
try{
  if(firebaseConfig.apiKey!=='YOUR_API_KEY' && window.firebase){
    firebase.initializeApp(firebaseConfig);
    auth=firebase.auth();
    db=firebase.firestore();
  }
}catch(e){ console.warn('Firebase init failed:',e); }
let me=null, tab='orders', D={orders:[],policies:[],claims:[],profiles:[]};
function tsMillis(ts){ if(!ts)return 0; if(ts.toMillis)return ts.toMillis(); if(ts.seconds)return ts.seconds*1000; return 0; }
function tsIso(ts){ const m=tsMillis(ts); return m?new Date(m).toISOString():''; }
function sortAndStamp(rows){
  rows.sort((a,b)=>tsMillis(b.created_at)-tsMillis(a.created_at));
  rows.forEach(r=>{ r.created_at=tsIso(r.created_at); });
  return rows;
}
const CLAIM_STAGES=['Submitted','Under Review','Approved','Paid'];

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}

async function doLogin(){
  const err=document.getElementById('l-err');err.textContent='';
  if(!auth||!db){err.textContent='Connection to the database could not be established — check your internet connection and reload.';return;}
  const btn=document.getElementById('l-btn');btn.disabled=true;btn.textContent='Checking…';
  try{
    const cred=await auth.signInWithEmailAndPassword(document.getElementById('l-email').value.trim(),document.getElementById('l-pass').value);
    await enter(cred.user);
  }catch(e){err.textContent=e.message||'Sign in failed';}
  finally{btn.disabled=false;btn.textContent='Sign in';}
}
async function signInWithGoogleAdmin(){
  const err=document.getElementById('l-err');err.textContent='';
  if(!auth||!db){err.textContent='Connection to the database could not be established — check your internet connection and reload.';return;}
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    const cred=await auth.signInWithPopup(provider);
    await enter(cred.user);
  }catch(e){
    const code=e&&e.code||'';
    if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request')return;
    err.textContent=e.message||'Sign in failed';
  }
}
async function enter(user){
  const snap=await db.collection('profiles').doc(user.uid).get();
  const prof=snap.exists?snap.data():null;
  if(!prof||!prof.is_admin){
    await auth.signOut();
    document.getElementById('l-err').textContent='This account does not have admin access.';
    return;
  }
  me={uid:user.uid,id:user.uid,email:user.email};
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('head-right').innerHTML='<span class="who">'+(prof.name||user.email)+' · admin</span><button class="btn ghost small" onclick="doLogout()">Sign out</button>';
  await refresh();
}
async function doLogout(){await auth.signOut();location.reload();}

async function refresh(){
  const [o,p,c,u]=await Promise.all([
    db.collection('orders').get(),
    db.collection('policies').get(),
    db.collection('claims').get(),
    db.collection('profiles').get(),
  ]);
  D.orders=sortAndStamp(o.docs.map(d=>({id:d.id,...d.data()})));
  D.policies=sortAndStamp(p.docs.map(d=>({id:d.id,...d.data()})));
  D.claims=sortAndStamp(c.docs.map(d=>({ref:d.id,...d.data()})));
  D.profiles=sortAndStamp(u.docs.map(d=>({id:d.id,...d.data()})));
  renderStats();renderTab();
}
function fmtDate(d){return d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';}
// Prefers the name/email snapshotted directly on the order/policy/claim row (works even if no profile
// doc exists yet or a guest's contact details changed since), falling back to a profiles lookup, then the uid.
function userOf(id,row){
  if(row&&row.customer_name)return row.customer_name+(row.is_guest?' <span class="stb pend" style="margin-left:4px;">guest</span>':'');
  const p=D.profiles.find(x=>x.id===id);
  if(p)return p.name||p.email||id.slice(0,8);
  return id?id.slice(0,8)+'…':'—';
}

function renderStats(){
  const pendingPay=D.orders.filter(o=>o.status==='pending').length;
  const mrr=D.policies.filter(p=>p.status!=='pending').reduce((s,p)=>s+(p.price||0),0);
  const openClaims=D.claims.filter(c=>(c.status||0)<3).length;
  document.getElementById('stats').innerHTML=
    '<div class="stat"><b>'+pendingPay+'</b><span>Payments awaiting confirmation</span></div>'+
    '<div class="stat"><b>'+D.policies.length+'</b><span>Policies ('+D.policies.filter(p=>p.status!=='pending').length+' active)</span></div>'+
    '<div class="stat"><b>'+openClaims+'</b><span>Open claims</span></div>'+
    '<div class="stat"><b>'+D.profiles.filter(function(p){return !p.is_guest;}).length+'</b><span>Registered customers ('+D.profiles.filter(function(p){return p.is_guest;}).length+' guest)</span></div>';
}
function showTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));document.getElementById('t-'+t).classList.add('on');renderTab();}

function renderTab(){
  const P=document.getElementById('panel');
  if(tab==='orders'){
    P.innerHTML='<h3>Payments</h3>'+(D.orders.length?'<table><tr><th>Reference</th><th>Customer</th><th>Plan</th><th>Amount</th><th>Method</th><th>Date</th><th>Status</th><th></th></tr>'+
      D.orders.filter(matchQ).map(o=>'<tr><td class="mono">'+o.reference+'</td><td>'+userOf(o.user_id,o)+'</td><td>'+(o.plan_name||'—')+'</td><td class="mono">MUR '+(o.amount||0).toLocaleString()+'</td><td>'+(o.method||'—')+'</td><td>'+fmtDate(o.created_at)+'</td>'+
      '<td><span class="stb '+(o.status==='paid'?'paid':o.status==='rejected'?'rej':'pend')+'">'+o.status+'</span></td>'+
      '<td style="white-space:nowrap;">'+(o.status==='pending'?'<button class="btn small" onclick="confirmPay(\''+o.id+'\')">Confirm payment</button> <button class="btn small ghost" onclick="rejectPay(\''+o.id+'\')">Reject</button> ':'')+'<button class="btn small danger" onclick="delOrder(\''+o.id+'\')">Delete</button></td></tr>').join('')+'</table>':'<div class="empty">No payments yet.</div>')+
      '<div class="note">Confirming a payment marks the order as paid and activates the linked policy — the customer sees it turn Active immediately.</div>';
  }
  if(tab==='policies'){
    P.innerHTML='<h3>Policies</h3>'+(D.policies.length?'<table><tr><th>Policy N°</th><th>Customer</th><th>Plan</th><th>Insurer</th><th>Premium</th><th>Type</th><th>Renews</th><th>Status</th><th></th></tr>'+
      D.policies.filter(matchQ).map(p=>'<tr><td class="mono">'+p.id+'</td><td>'+userOf(p.user_id,p)+'</td><td>'+p.name+'</td><td>'+(p.insurer||'—')+'</td><td class="mono">MUR '+(p.price||0).toLocaleString()+'/mo</td><td>'+(p.type||'—')+'</td><td>'+(p.renews||'—')+'</td>'+
      '<td><span class="stb '+(p.status==='pending'?'pend':'act')+'">'+(p.status||'active')+'</span></td>'+
      '<td style="white-space:nowrap;">'+(p.status==='pending'?'<button class="btn small" onclick="activatePolicy(\''+p.id+'\')">Activate</button> ':'')+'<button class="btn small danger" onclick="delPolicy(\''+p.id+'\')">Delete</button></td></tr>').join('')+'</table>':'<div class="empty">No policies yet.</div>');
  }
  if(tab==='claims'){
    P.innerHTML='<h3>Claims</h3>'+(D.claims.length?'<table><tr><th>Reference</th><th>Customer</th><th>Policy</th><th>Type</th><th>Amount</th><th>Date</th><th>Stage</th><th></th></tr>'+
      D.claims.filter(matchQ).map(c=>{const st=c.status||0;return '<tr><td class="mono">'+c.ref+'</td><td>'+userOf(c.user_id,c)+'</td><td>'+(c.policy||'—')+'</td><td>'+(c.type||'—')+'</td><td class="mono">'+(c.amount?'MUR '+c.amount.toLocaleString():'—')+'</td><td>'+fmtDate(c.created_at)+'</td>'+
      '<td><span class="stb '+(st===3?'paid':st===0?'pend':'act')+'">'+CLAIM_STAGES[st]+'</span></td>'+
      '<td style="white-space:nowrap;">'+(st<3?'<button class="btn small" onclick="advanceClaim(\''+c.ref+'\','+st+')">Move to '+CLAIM_STAGES[st+1]+'</button> ':'')+'<button class="btn small danger" onclick="delClaim(\''+c.ref+'\')">Delete</button></td></tr>';}).join('')+'</table>':'<div class="empty">No claims yet.</div>');
  }
  if(tab==='users'){
    P.innerHTML='<h3>Customers &amp; team</h3>'+(D.profiles.length?'<table><tr><th>Name</th><th>Email</th><th>Joined</th><th>Policies</th><th>Claims</th><th>Role</th><th></th></tr>'+
      D.profiles.filter(matchQ).map(u=>'<tr><td>'+(u.name||'—')+'</td><td class="mono" style="font-size:11.5px;">'+(u.email||'—')+'</td><td>'+fmtDate(u.created_at)+'</td><td class="mono">'+D.policies.filter(p=>p.user_id===u.id).length+'</td><td class="mono">'+D.claims.filter(c=>c.user_id===u.id).length+'</td><td>'+(u.is_admin?'<span class="stb act">admin</span>':(u.is_guest?'<span class="stb pend">guest</span>':'customer'))+'</td>'+
      '<td style="white-space:nowrap;">'+
        (u.id===me.id?'<span style="font-size:11px;color:var(--muted);">you</span>':
          (u.is_admin?'<button class="btn small ghost" onclick="setAdmin(\''+u.id+'\',false)">Revoke admin</button>':'<button class="btn small ghost" onclick="setAdmin(\''+u.id+'\',true)">Make admin</button>')+
          (u.email?' <button class="btn small ghost" onclick="sendReset(\''+u.email+'\')">Send password reset</button>':''))+
      '</td></tr>').join('')+'</table>':'<div class="empty">No customers yet.</div>')+
      '<div class="note">Make admin gives that account full access to this panel — grant it only to people you trust. Send password reset emails the user a secure link to choose a new password; nobody ever sees or types anyone else\'s password.</div>';
  }
}

async function confirmPay(id){
  const o=D.orders.find(x=>x.id===id);if(!o)return;
  try{
    await db.collection('orders').doc(id).update({status:'paid'});
    if(o.policy_id){
      try{ await db.collection('policies').doc(o.policy_id).update({status:'active'}); }
      catch(e2){ toast('Order paid, but policy update failed: '+e2.message); await refresh(); return; }
    }
    toast('Payment '+o.reference+' confirmed — policy activated');
  }catch(e){toast('Error: '+e.message);}
  await refresh();
}
async function rejectPay(id){
  try{ await db.collection('orders').doc(id).update({status:'rejected'}); toast('Payment marked as rejected'); }
  catch(e){ toast('Error: '+e.message); }
  await refresh();
}
async function activatePolicy(id){
  try{ await db.collection('policies').doc(id).update({status:'active'}); toast('Policy '+id+' activated'); }
  catch(e){ toast('Error: '+e.message); }
  await refresh();
}
function matchQ(x){const el=document.getElementById('q');const q=el?el.value.trim().toLowerCase():'';if(!q)return true;return JSON.stringify(x).toLowerCase().includes(q);}
async function doRefresh(){await refresh();toast('Data refreshed');}
function exportCSV(){
  const map={orders:D.orders,policies:D.policies,claims:D.claims,users:D.profiles};
  const rows=(map[tab]||[]).filter(matchQ);
  if(!rows.length){toast('Nothing to export');return;}
  const cols=Object.keys(rows[0]);
  const esc=v=>{v=(v===null||v===undefined)?'':String(v);return '"'+v.replace(/"/g,'""')+'"';};
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='oneinsurance-'+tab+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast(rows.length+' rows exported');
}
async function delPolicy(id){
  if(!confirm('Permanently delete policy '+id+'? The customer will no longer see it. This cannot be undone.'))return;
  try{ await db.collection('policies').doc(id).delete(); toast('Policy '+id+' deleted'); }
  catch(e){ toast('Error: '+e.message); }
  await refresh();
}
async function delOrder(id){
  if(!confirm('Permanently delete payment record '+id+'? This cannot be undone.'))return;
  try{ await db.collection('orders').doc(id).delete(); toast('Payment record deleted'); }
  catch(e){ toast('Error: '+e.message); }
  await refresh();
}
async function delClaim(ref){
  if(!confirm('Permanently delete claim '+ref+'? This cannot be undone.'))return;
  try{ await db.collection('claims').doc(ref).delete(); toast('Claim '+ref+' deleted'); }
  catch(e){ toast('Error: '+e.message); }
  await refresh();
}
async function setAdmin(id,flag){
  if(flag && !confirm('Give this account full admin access to policies, payments and customer data?'))return;
  try{ await db.collection('profiles').doc(id).update({is_admin:flag}); toast(flag?'Admin access granted':'Admin access revoked'); }
  catch(e){ toast('Error: '+e.message); }
  await refresh();
}
async function sendReset(email){
  try{
    await auth.sendPasswordResetEmail(email);
    toast('Password reset email sent to '+email);
  }catch(e){toast('Error: '+(e.message||'could not send'));}
}
async function advanceClaim(ref,st){
  try{ await db.collection('claims').doc(ref).update({status:st+1}); toast('Claim '+ref+' → '+CLAIM_STAGES[st+1]); }
  catch(e){ toast('Error: '+e.message); }
  await refresh();
}

/* restore session */
if(auth){
  auth.onAuthStateChanged(async function(user){
    if(user)await enter(user);
  });
}
</script>
</body>
